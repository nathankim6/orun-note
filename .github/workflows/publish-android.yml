name: Publish verified Android APK
on:
  workflow_dispatch:
    inputs:
      qa_run:
        description: Successful native-smoke.yml run on this exact commit
        type: string
        required: true
      apk_run:
        description: Successful android-apk.yml run on this exact commit
        type: string
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Verify exact-commit native simulations and signed build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_RUN: ${{ inputs.qa_run }}
          APK_RUN: ${{ inputs.apk_run }}
        run: node scripts/verify-native-qa.js
      - uses: actions/download-artifact@v4
        with:
          name: paperly-release-apk
          path: verified-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.apk_run }}
      - name: Reverify identity and publish original signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(find verified-apk -name '*.apk' | wc -l)" -eq 1
          APK=$(find verified-apk -name '*.apk')
          SDKTOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          "$SDKTOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-verification.txt
          node scripts/verify-apk-certificate.js apk-verification.txt
          VER=$(node -p "require('./app.json').expo.version")
          CODE=$(node -e "const [a,b,c]=require('./app.json').expo.version.split('.').map(Number);console.log(a*10000+b*100+c)")
          "$SDKTOOLS/aapt" dump badging "$APK" > apk-badging.txt
          head -1 apk-badging.txt > apk-package.txt
          grep -q "package: name='com.paperly.study'.*versionCode='$CODE'.*versionName='$VER'" apk-package.txt
          "$SDKTOOLS/aapt" dump permissions "$APK" > apk-permissions.txt
          if grep -Eq 'android.permission.(READ_SMS|RECEIVE_SMS|BIND_NOTIFICATION_LISTENER_SERVICE|BIND_ACCESSIBILITY_SERVICE|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW)' apk-permissions.txt; then
            echo 'Unexpected sensitive permission: refusing release'; exit 1
          fi
          cp "$APK" orun-note-galaxytab-arm64.apk
          SHA=$(sha256sum orun-note-galaxytab-arm64.apk | cut -d' ' -f1)
          printf '보강영상 안정성 및 PDF 읽기 경로 개선. Android·iOS 네이티브 시뮬레이션 통과 후 배포. 실기기 성능은 별도 확인이 필요합니다.\n\nAPK SHA-256: %s\n' "$SHA" > release-notes.txt
          TAG="v${VER}-android"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'A published version is immutable. Increment version instead of silently replacing it.'; exit 1
          fi
          gh release create "$TAG" orun-note-galaxytab-arm64.apk --target "$GITHUB_SHA" --title "옳은Note ${VER} (Android)" --notes-file release-notes.txt
