name: Android APK (Galaxy Tab sideload)
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after native QA passes on this commit
        type: boolean
        default: false
      qa_run:
        description: Successful native-smoke.yml run ID for this exact commit
        type: string
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (preinstalled SDK)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test ink, update policy and PDF scheduling
        run: node scripts/test-fixed-ink.js && node scripts/test-ink-gesture.js && node scripts/test-app-updates.js && node scripts/test-update-server.js && node scripts/test-pdf-scheduler.js && node scripts/test-pdf-pipeline.js && node scripts/test-pdf-presentation.js && node scripts/test-zoom-pad-quality.js && node scripts/test-pdf-zoom-sharpness.js && node scripts/test-pdf-native-errors.js && node scripts/generate-review-video-preferences.js --check && node scripts/test-review-videos.js && node scripts/test-native-qa-gate.js && node scripts/test-pdf-process-plugin.js && node scripts/test-viewer-hooks.js && node scripts/test-apk-certificate.js
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Load the existing release keystore (never generate a replacement)
        run: |
          mkdir -p ~/.keys
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.keys/paperly.jks
            echo "STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "::error::The existing release keystore is required for safe in-place and mandatory updates."
            exit 1
          fi
      - name: Verify local native module is present
        run: test -f modules/pdf-renderer/android/build.gradle && test -f modules/pdf-renderer/ios/PdfRendererModule.swift
      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file=$HOME/.keys/paperly.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASS \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS
      - name: Verify update signature and package identity before publishing
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          SDKTOOLS=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)
          "$SDKTOOLS/apksigner" verify --verbose --print-certs "$APK" > apk-verification.txt
          cat apk-verification.txt
          node scripts/verify-apk-certificate.js apk-verification.txt
          VER=$(node -p "require('./app.json').expo.version")
          CODE=$(node -e "const [a,b,c]=require('./app.json').expo.version.split('.').map(Number);console.log(a*10000+b*100+c)")
          "$SDKTOOLS/aapt" dump badging "$APK" > apk-badging.txt
          head -1 apk-badging.txt > apk-package.txt
          cat apk-package.txt
          grep -q "package: name='com.paperly.study'.*versionCode='$CODE'.*versionName='$VER'" apk-package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paperly-release-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Verify native simulation release gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QA_RUN: ${{ inputs.qa_run }}
        run: node scripts/verify-native-qa.js
      - name: Publish APK to GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          TAG="v${VER}-android"
          cp android/app/build/outputs/apk/release/*.apk orun-note-galaxytab-arm64.apk
          gh release create "$TAG" orun-note-galaxytab-arm64.apk --title "옳은Note ${VER} (Android)" --notes "옳은Note Android 설치 파일(arm64). 기존 버전 위에 덮어쓰기 설치할 수 있어요." || gh release upload "$TAG" orun-note-galaxytab-arm64.apk --clobber
