name: iOS build (iPad)
on:
  push: { branches: [main] }
  workflow_dispatch: {}
jobs:
  compile-check:
    # Unsigned simulator build: verifies the Swift PDFKit/CryptoKit module and the RN app compile on iOS.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.2' }
      - run: xcodebuild -version && swift --version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Relax Swift 6 strict-concurrency in expo-modules-jsi (Xcode 26.3 regression)
        run: sed -i '' 's/swiftLanguageModes: \[.v6\]/swiftLanguageModes: [.v5]/' node_modules/expo-modules-jsi/apple/Package.swift && grep -n swiftLanguageModes node_modules/expo-modules-jsi/apple/Package.swift
      - run: npx expo prebuild --platform ios --no-install
      - run: cd ios && pod install
      - name: Build for iOS Simulator (no signing)
        run: |
          cd ios
          xcodebuild -workspace Paperly.xcworkspace -scheme Paperly -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  testflight:
    # Signed App Store/TestFlight build. Requires secrets:
    #   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64,
    #   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8_BASE64
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.2' }
      - run: xcodebuild -version && swift --version
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Relax Swift 6 strict-concurrency in expo-modules-jsi (Xcode 26.3 regression)
        run: sed -i '' 's/swiftLanguageModes: \[.v6\]/swiftLanguageModes: [.v5]/' node_modules/expo-modules-jsi/apple/Package.swift && grep -n swiftLanguageModes node_modules/expo-modules-jsi/apple/Package.swift
      - run: npx expo prebuild --platform ios --no-install
      - run: cd ios && pod install
      - name: Import signing assets
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security create-keychain -p ci build.keychain; security default-keychain -s build.keychain; security unlock-keychain -p ci build.keychain
          echo "$P12" | base64 -d > cert.p12; security import cert.p12 -k build.keychain -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security find-identity -v -p codesigning build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles; echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/paperly.mobileprovision
          echo "PROFILE_UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/paperly.mobileprovision | plutil -extract UUID raw -)" >> $GITHUB_ENV
      - name: Archive and export IPA
        run: |
          cd ios
          xcodebuild -workspace Paperly.xcworkspace -scheme Paperly -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Paperly.xcarchive archive DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="iPhone Distribution" PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.0
          cat > ExportOptions.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>com.paperly.study</key><string>$PROFILE_UUID</string></dict></dict></plist>
          PL
          xcodebuild -exportArchive -archivePath build/Paperly.xcarchive -exportOptionsPlist ExportOptions.plist -exportPath build/out
      - name: Upload to TestFlight
        env:
          KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys; echo "$KEY_P8" | base64 -d > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          xcrun altool --upload-app -f ios/build/out/*.ipa -t ios --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
      - uses: actions/upload-artifact@v4
        with: { name: paperly-ipa, path: ios/build/out/*.ipa }
