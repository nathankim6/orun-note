name: Native simulator smoke (QA only)
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NATIVE_SMOKE_QA: '1'
      CI: '1'
      NATIVE_SMOKE_ALLOW_SYNTHETIC_SCREENSHOT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - name: Test diagnostic privacy and process attribution (no device)
        run: node --test qa/native-diagnostics.test.mjs
      - name: Allow emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prebuild and bundle QA-only Android APK
        timeout-minutes: 50
        run: |
          scripts/native-with-qa-entry.sh bash -c 'npx expo prebuild --platform android --no-install && cd android && ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=x86_64'
          git diff --exit-code -- index.ts
      - name: Real Android emulator UI smoke
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_tablet
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p qa/build qa/output
            adb install android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            bash scripts/native-android-ci.sh
      - name: Sanitize Android failure output too
        if: always()
        run: node scripts/native-sanitize.mjs qa/build/android.raw qa/output/android.jsonl android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-android-sanitized-logs
          path: qa/output/android.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Upload synthetic QA failure-only screenshot (not completion proof)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Synthetic-QA-failure-only-Android-screenshot
          path: qa/output/android-synthetic-qa-failure.png
          if-no-files-found: ignore
          retention-days: 1
  ios:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NATIVE_SMOKE_QA: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: '26.2' }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Unsigned iOS Simulator build and XCTest UI smoke
        timeout-minutes: 80
        run: |
          scripts/native-with-qa-entry.sh bash -c 'npx expo prebuild --platform ios --no-install && (cd ios && pod install) && scripts/native-ios-smoke.sh'
          git diff --exit-code -- index.ts
      - name: Sanitize iOS failure output too
        if: always()
        run: node scripts/native-sanitize.mjs qa/build/ios.raw qa/output/ios.jsonl ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-ios-sanitized-logs
          path: qa/output/ios.jsonl
          if-no-files-found: warn
          retention-days: 7
