plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdfrenderer'
version = '1.0.0'

android {
  namespace "expo.modules.pdfrenderer"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Text layer (word positions) for tap-to-define and search; PdfRenderer only rasterizes.
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
